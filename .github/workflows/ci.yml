name: CI

on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the repo and runs tests. Nothing here needs to
# write, and `npm ci` runs install scripts from every dependency, so the
# job should not be holding a token that can push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # verifier-core is currently a git dependency, and its `prepare` script
      # builds with pnpm — so installing it needs pnpm on the runner, which
      # ubuntu-latest does not carry. Corepack takes the version from the
      # dependency's own `packageManager` field.
      #
      # This step comes out when we move back to an npm release. It is the
      # clearest argument for publishing `2.0.0-beta1`: every consumer of the
      # git SHA pays this, and npm 11 flags the install script besides.
      - run: corepack enable
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # verifier-core is currently a git dependency, and its `prepare` script
      # builds with pnpm — so installing it needs pnpm on the runner, which
      # ubuntu-latest does not carry. Corepack takes the version from the
      # dependency's own `packageManager` field.
      #
      # This step comes out when we move back to an npm release. It is the
      # clearest argument for publishing `2.0.0-beta1`: every consumer of the
      # git SHA pays this, and npm 11 flags the install script besides.
      - run: corepack enable
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
