<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>verifier-plugin dev</title>
  <style>body{color:#16202e;background:#f5f6f8;margin:0;padding:32px 20px 80px;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:540px;margin:0 auto}h1{margin:0 0 4px;font-size:1.2rem}p.note{color:#6e7a8f;margin:0 0 20px;font-size:.9rem}.switch{flex-wrap:wrap;gap:6px;margin-bottom:18px;display:flex}.switch button{font:inherit;cursor:pointer;color:#47536a;background:#fff;border:1px solid #bfc8d6;border-radius:5px;padding:7px 11px;font-size:.78rem}.switch button:hover{color:#24476f;border-color:#24476f}.switch button[aria-pressed=true]{color:#fff;background:#24476f;border-color:#24476f}#log{color:#47536a;white-space:pre-wrap;background:#fff;border:1px solid #d9dee7;border-radius:8px;max-height:220px;margin-top:22px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:.76rem;overflow:auto}.problem{margin:0}.problem:not(:empty){background:#fff;border:1px solid #d9dee7;border-radius:8px;padding:14px 16px}.problem strong{margin-bottom:4px;display:block}.problem code{overflow-wrap:anywhere}</style>
  <script type="module" crossorigin src="/verifier-plugin/assets/index-HkU-0d8c.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>verifier-plugin</h1>
    <p class="note" id="intro">Real credentials, really signed, really verified. Pick a situation.</p>
    <div class="switch" id="switch" role="group" aria-label="Situation"></div>
    <p class="note" id="note"></p>
    <!-- On the page from the start, empty: a status region that arrives
         already holding its text may never be read out. -->
    <p class="problem" id="problem" role="status"></p>
    <verifier-credential id="vc"></verifier-credential>
    <div id="log">waiting…</div>
  </div>
</body>
</html>
